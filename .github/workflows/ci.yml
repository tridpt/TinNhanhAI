name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt plus the test/lint
          # tooling (pytest, pytest-mock, ruff) that is kept out of the prod image.
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Audit dependencies for known CVEs
        run: |
          pip install pip-audit
          # diskcache 5.6.3 is the latest release; CVE-2025-69872 (pickle RCE)
          # has no fixed version yet and only applies with write access to the
          # local cache dir. Ignore it explicitly so CI still flags *new* CVEs.
          pip-audit -r requirements.txt --ignore-vuln CVE-2025-69872

      - name: Smoke import
        run: python -c "import app; import services; import services.vn_prices; import services.vn_gold; import services.telegram_alert; import services.rate_limit; import services.history; import services.news_store; import services.crypto; import services.stocks; import services.weather; import services.reader; print('ok')"

      - name: Run pytest
        run: python -m pytest

      - name: Health endpoint smoke test
        env:
          DEBUG: "0"
          TINNHANH_PROD: "0"
        run: |
          python app.py &
          APP_PID=$!
          for _ in {1..15}; do
            if curl -fsS http://127.0.0.1:5055/api/health > /dev/null; then
              echo "Health OK"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5055/api/health
          kill $APP_PID

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dev dependencies
        run: npm install

      - name: Run frontend logic tests
        run: npm test
