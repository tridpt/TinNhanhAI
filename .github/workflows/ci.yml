name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Smoke import
        run: python -c "import app; import services; import services.vn_prices; import services.vn_gold; import services.telegram_alert; import services.rate_limit; import services.history; import services.news_store; import services.crypto; import services.stocks; import services.weather; import services.reader; print('ok')"

      - name: Run pytest
        run: python -m pytest

      - name: Health endpoint smoke test
        env:
          DEBUG: "0"
          TINNHANH_PROD: "0"
        run: |
          python app.py &
          APP_PID=$!
          for _ in {1..15}; do
            if curl -fsS http://127.0.0.1:5055/api/health > /dev/null; then
              echo "Health OK"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5055/api/health
          kill $APP_PID
